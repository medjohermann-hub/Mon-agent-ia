<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mon Agent IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #7c6af7;
    --accent2: #f77c6a;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --user-bubble: #1a1a2e;
    --ai-bubble: #141420;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    padding: 16px 20px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .avatar {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; }

  .header-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.3px;
  }

  .header-status {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* SYSTEM PROMPT AREA */
  .system-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
    flex-shrink: 0;
  }

  .system-panel.open {
    max-height: 160px;
    padding: 12px 16px;
  }

  .system-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .system-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 10px 12px;
    resize: none;
    height: 80px;
    outline: none;
    line-height: 1.5;
  }

  .system-input:focus { border-color: var(--accent); }

  .gear-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    transition: color 0.2s;
  }
  .gear-btn:hover, .gear-btn.active { color: var(--accent); }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 0; }

  .message {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.ai { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user .bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-time {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }

  /* TYPING INDICATOR */
  .typing-bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    padding: 14px 18px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: typing 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 80%, 100% { transform: scale(1); opacity: 0.4; }
    40% { transform: scale(1.3); opacity: 1; }
  }

  /* INPUT */
  .input-area {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    padding: 10px 16px;
    transition: border-color 0.2s;
    min-height: 44px;
  }

  .input-wrap:focus-within { border-color: var(--accent); }

  #userInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 120px;
    min-height: 22px;
    overflow-y: auto;
  }

  #userInput::placeholder { color: var(--muted); }

  .send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: transform 0.15s, opacity 0.2s;
    box-shadow: 0 4px 15px rgba(124, 106, 247, 0.35);
  }

  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; fill: white; }

  /* WELCOME */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 0.4s ease;
  }

  .welcome-emoji { font-size: 48px; margin-bottom: 16px; }

  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .welcome p { color: var(--muted); font-size: 13px; line-height: 1.6; }

  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 24px;
  }

  .suggestion-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s, background 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .suggestion-chip:active { background: var(--user-bubble); border-color: var(--accent); }

  /* CLEAR */
  .clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.2s;
  }

  .clear-btn:hover { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div class="avatar">🤖</div>
  <div class="header-info">
    <div class="header-name">Mon Agent IA</div>
    <div class="header-status">
      <span class="dot"></span>
      <span>En ligne · Claude</span>
    </div>
  </div>
  <button class="gear-btn" id="gearBtn" title="Personnaliser l'agent">⚙️</button>
  <button class="clear-btn" id="clearBtn" title="Effacer la conversation">🗑</button>
</header>

<div class="system-panel" id="systemPanel">
  <div class="system-label">Rôle de l'agent (system prompt)</div>
  <textarea class="system-input" id="systemPrompt" placeholder="Ex: Tu es un assistant cuisinier expert. Réponds toujours en donnant des recettes simples et rapides.">Tu es un assistant IA intelligent, utile et concis. Tu réponds toujours en français, avec clarté et précision.</textarea>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-emoji">✨</div>
    <h2>Ton agent IA personnel</h2>
    <p>Pose-moi n'importe quelle question.<br>Personnalise mon rôle avec le ⚙️ en haut.</p>
    <div class="suggestions">
      <button class="suggestion-chip" onclick="sendSuggestion(this)">💡 Explique-moi l'intelligence artificielle simplement</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">📝 Aide-moi à écrire un email professionnel</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">🧠 Donne-moi 3 astuces pour mieux mémoriser</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="Écris un message..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcomeEl = document.getElementById('welcome');
  const systemPromptEl = document.getElementById('systemPrompt');
  const systemPanel = document.getElementById('systemPanel');
  const gearBtn = document.getElementById('gearBtn');

  let history = [];
  let isLoading = false;

  // Gear toggle
  gearBtn.addEventListener('click', () => {
    systemPanel.classList.toggle('open');
    gearBtn.classList.toggle('active');
  });

  // Clear
  document.getElementById('clearBtn').addEventListener('click', () => {
    history = [];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = '';
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Enter to send (not on mobile shift+enter)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(btn) {
    inputEl.value = btn.textContent.slice(3); // remove emoji
    sendMessage();
  }

  function now() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(role, text) {
    if (welcomeEl) welcomeEl.style.display = 'none';

    const div = document.createElement('div');
    div.className = `message ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();

    div.appendChild(bubble);
    div.appendChild(time);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';
    div.innerHTML = `<div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    showTyping();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: systemPromptEl.value.trim() || 'Tu es un assistant IA utile. Réponds en français.',
          messages: history
        })
      });

      const data = await response.json();
      removeTyping();

      const reply = data.content?.map(b => b.text || '').join('') || 'Désolé, je n\'ai pas pu répondre.';
      history.push({ role: 'assistant', content: reply });
      addMessage('ai', reply);

    } catch (err) {
      removeTyping();
      addMessage('ai', '⚠️ Erreur de connexion. Vérifie ta connexion internet.');
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
